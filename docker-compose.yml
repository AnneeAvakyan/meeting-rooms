services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/booking?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  # Пока приложение использует in-memory хранилище (internal/storage/memory.go),
  # эта служба не задействована. Понадобится, когда появится PostgreSQL-репозиторий
  # и миграции в ./migrations.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booking
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
